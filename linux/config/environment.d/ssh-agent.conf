# SSH_AUTH_SOCK for the whole systemd user session, not just interactive shells.
#
# shared/shellrc already points SSH_AUTH_SOCK at gcr-ssh-agent's socket, but
# ~/.bashrc sources shellrc only when the shell is interactive. A non-interactive
# bash -- a git hook, an editor subprocess, an agent running `git commit` -- never
# sees it, and a signed commit there dies on:
#   error: ssh_askpass: exec(/usr/lib/ssh/ssh-askpass): No such file or directory
# with the key sitting unlocked in the keyring the whole time.
#
# systemd reads this at user-session start, so every process in the session
# inherits the socket regardless of shell or interactivity. Takes effect on next
# login; `systemctl --user import-environment SSH_AUTH_SOCK` is not needed --
# gcr-ssh-agent.service already set-environments it for services started later.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/gcr/ssh
